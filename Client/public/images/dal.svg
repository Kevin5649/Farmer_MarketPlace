<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#FDE047"/>
    </linearGradient>
    <linearGradient id="dalSoup" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="245" rx="105" ry="18" fill="#B45309" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Bowl -->
    <path d="M 115 150 C 115 230, 285 230, 285 150 Z" fill="url(#bowl)"/>
    <ellipse cx="200" cy="150" rx="85" ry="25" fill="#1E293B"/>
    <!-- Dal liquid -->
    <ellipse cx="200" cy="150" rx="80" ry="22" fill="url(#dalSoup)"/>
    <!-- Tadka garnish (chili & coriander) -->
    <ellipse cx="190" cy="148" rx="15" ry="4" transform="rotate(-15 190 148)" fill="#DC2626"/>
    <circle cx="215" cy="147" r="4" fill="#16A34A"/>
    <circle cx="222" cy="151" r="3" fill="#16A34A"/>
    <circle cx="180" cy="152" r="3" fill="#16A34A"/>
  </g>
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="1">ORGANIC TOOR DAL</text>
</svg>
