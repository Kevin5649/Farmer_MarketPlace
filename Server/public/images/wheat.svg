<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="wheatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="245" rx="80" ry="14" fill="#B45309" opacity="0.2"/>
  <g filter="url(#shadow)">
    <!-- Wheat Stalks -->
    <path d="M 200 240 Q 190 150 185 60" stroke="#D97706" stroke-width="4" fill="none"/>
    <path d="M 200 240 Q 215 160 225 70" stroke="#D97706" stroke-width="4" fill="none"/>
    <!-- Grains on stalk 1 -->
    <g fill="url(#wheatGrad)">
      <ellipse cx="178" cy="80" rx="10" ry="5" transform="rotate(-35 178 80)"/>
      <ellipse cx="194" cy="90" rx="10" ry="5" transform="rotate(35 194 90)"/>
      <ellipse cx="179" cy="110" rx="11" ry="5.5" transform="rotate(-35 179 110)"/>
      <ellipse cx="197" cy="120" rx="11" ry="5.5" transform="rotate(35 197 120)"/>
      <ellipse cx="182" cy="140" rx="11" ry="5.5" transform="rotate(-35 182 140)"/>
      <ellipse cx="200" cy="150" rx="11" ry="5.5" transform="rotate(35 200 150)"/>
      <ellipse cx="184" cy="170" rx="10" ry="5" transform="rotate(-35 184 170)"/>
      <ellipse cx="201" cy="180" rx="10" ry="5" transform="rotate(35 201 180)"/>
      <!-- Stalk 2 -->
      <ellipse cx="218" cy="90" rx="10" ry="5" transform="rotate(-35 218 90)"/>
      <ellipse cx="233" cy="100" rx="10" ry="5" transform="rotate(35 233 100)"/>
      <ellipse cx="215" cy="120" rx="11" ry="5.5" transform="rotate(-35 215 120)"/>
      <ellipse cx="230" cy="130" rx="11" ry="5.5" transform="rotate(35 230 130)"/>
      <ellipse cx="210" cy="150" rx="11" ry="5.5" transform="rotate(-35 210 150)"/>
      <ellipse cx="225" cy="160" rx="11" ry="5.5" transform="rotate(35 225 160)"/>
    </g>
  </g>
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="1">GOLDEN WHEAT</text>
</svg>
