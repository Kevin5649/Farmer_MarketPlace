<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <radialGradient id="pea" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="240" rx="90" ry="16" fill="#B45309" opacity="0.2"/>
  <g filter="url(#shadow)">
    <!-- Main chickpea -->
    <path d="M 200 120 C 180 120, 165 140, 165 165 C 165 195, 190 215, 215 215 C 240 215, 255 195, 255 165 C 255 135, 225 110, 205 120 Z" fill="url(#pea)"/>
    <!-- Chickpea beak -->
    <path d="M 205 118 Q 200 110 195 118" stroke="#92400E" stroke-width="3" fill="none"/>
    <!-- Second chickpea -->
    <circle cx="150" cy="180" r="28" fill="url(#pea)"/>
    <!-- Third chickpea -->
    <circle cx="260" cy="185" r="25" fill="url(#pea)"/>
  </g>
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="1">DESI CHICKPEAS</text>
</svg>
