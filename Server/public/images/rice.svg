<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="bowl" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="245" rx="100" ry="18" fill="#475569" opacity="0.25"/>
  <g filter="url(#shadow)">
    <!-- Bowl -->
    <path d="M 120 160 C 120 230, 280 230, 280 160 Z" fill="url(#bowl)"/>
    <ellipse cx="200" cy="160" rx="80" ry="25" fill="#334155"/>
    <!-- Rice mound -->
    <ellipse cx="200" cy="150" rx="76" ry="35" fill="#FFFFFF"/>
    <ellipse cx="200" cy="140" rx="60" ry="25" fill="#F8FAFC"/>
    <!-- Grains texture -->
    <g fill="#CBD5E1" opacity="0.8">
      <ellipse cx="170" cy="135" rx="8" ry="3" transform="rotate(25 170 135)"/>
      <ellipse cx="195" cy="130" rx="9" ry="3" transform="rotate(-15 195 130)"/>
      <ellipse cx="225" cy="138" rx="8" ry="3" transform="rotate(40 225 138)"/>
      <ellipse cx="180" cy="150" rx="9" ry="3.5" transform="rotate(-30 180 150)"/>
      <ellipse cx="210" cy="150" rx="8" ry="3" transform="rotate(10 210 150)"/>
      <ellipse cx="150" cy="145" rx="8" ry="3" transform="rotate(60 150 145)"/>
      <ellipse cx="240" cy="148" rx="8" ry="3" transform="rotate(-45 240 148)"/>
    </g>
  </g>
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">BASMATI RICE</text>
</svg>
