<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCFCE7"/>
      <stop offset="100%" stop-color="#BBF7D0"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="240" rx="90" ry="15" fill="#15803D" opacity="0.15"/>
  <g filter="url(#shadow)">
    <!-- Leaves -->
    <path d="M 200 230 C 170 180, 130 140, 160 80 C 190 85, 230 130, 200 230 Z" fill="url(#leafGrad)"/>
    <path d="M 200 230 C 230 170, 280 130, 250 80 C 220 85, 180 140, 200 230 Z" fill="url(#leafGrad)" opacity="0.9"/>
    <path d="M 200 230 C 150 190, 110 170, 120 120 C 150 125, 185 160, 200 230 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <path d="M 200 230 C 250 190, 290 170, 280 120 C 250 125, 215 160, 200 230 Z" fill="url(#leafGrad)" opacity="0.85"/>
    <!-- Leaf veins -->
    <path d="M 185 190 Q 180 130 180 90" stroke="#86EFAC" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M 215 190 Q 220 130 220 90" stroke="#86EFAC" stroke-width="2.5" fill="none" opacity="0.7"/>
  </g>
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#166534" text-anchor="middle" letter-spacing="1">FRESH SPINACH</text>
</svg>
