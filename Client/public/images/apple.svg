<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <radialGradient id="apple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <ellipse cx="200" cy="235" rx="85" ry="16" fill="#991B1B" opacity="0.18"/>
  <g filter="url(#shadow)">
    <!-- Apple Body -->
    <path d="M 200 115 C 180 85, 120 90, 120 155 C 120 215, 175 235, 200 230 C 225 235, 280 215, 280 155 C 280 90, 220 85, 200 115 Z" fill="url(#apple)"/>
    <!-- Stem -->
    <path d="M 200 115 Q 205 80 220 65" stroke="#78350F" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Leaf -->
    <path d="M 208 85 Q 240 70 245 90 Q 225 105 208 85 Z" fill="#22C55E"/>
    <!-- Highlight -->
    <ellipse cx="160" cy="140" rx="20" ry="35" transform="rotate(-25 160 140)" fill="#FFF" opacity="0.25"/>
  </g>
  <text x="200" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle" letter-spacing="1">HIMALAYAN APPLE</text>
</svg>
